server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite build assets — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes like /settings, /campaigns, /pages/:id
    # don't exist as files, so serve index.html and let React Router handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
